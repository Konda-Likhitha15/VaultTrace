<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">VaultTrace document lifecycle</title>
  <desc id="desc">Owner authorization, validation, private storage, database metadata, sharing, versioning, retrieval, and recoverable deletion.</desc>
  <rect width="1000" height="500" rx="20" fill="#f8fafc"/>
  <text x="44" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Document lifecycle</text>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker></defs>
  <g font-family="Arial,sans-serif">
    <rect x="45" y="115" width="190" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="68" y="153" font-size="18" font-weight="700" fill="#1e3a8a">Owner upload</text><text x="68" y="184" font-size="14" fill="#334155">Active account required</text>
    <rect x="280" y="115" width="190" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="303" y="153" font-size="18" font-weight="700" fill="#075985">Validate</text><text x="303" y="184" font-size="14" fill="#334155">Size · MIME · signature</text>
    <rect x="515" y="115" width="190" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="538" y="153" font-size="18" font-weight="700" fill="#92400e">Store privately</text><text x="538" y="184" font-size="14" fill="#334155">UUID object key</text>
    <rect x="750" y="115" width="205" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="773" y="153" font-size="18" font-weight="700" fill="#166534">Persist metadata</text><text x="773" y="184" font-size="14" fill="#334155">Document + version + audit</text>
    <path d="M235 165 H270 M470 165 H505 M705 165 H740" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="125" y="300" width="220" height="105" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="150" y="340" font-size="18" font-weight="700" fill="#5b21b6">Share / version</text><text x="150" y="370" font-size="14" fill="#334155">Same-org grants, expiry, revoke</text>
    <rect x="390" y="300" width="220" height="105" rx="14" fill="#fff" stroke="#0284c7" stroke-width="2"/><text x="415" y="340" font-size="18" font-weight="700" fill="#075985">Authorize each read</text><text x="415" y="370" font-size="14" fill="#334155">Owner or current grant</text>
    <rect x="655" y="300" width="220" height="105" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="680" y="340" font-size="18" font-weight="700" fill="#166534">Preview / download</text><text x="680" y="370" font-size="14" fill="#334155">API streams from provider</text>
    <path d="M852 215 C852 265 765 270 765 290 M345 352 H380 M610 352 H645" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
  </g>
  <text x="44" y="466" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Delete is recoverable soft deletion. Purging stored content requires a separate retention process.</text>
</svg>
