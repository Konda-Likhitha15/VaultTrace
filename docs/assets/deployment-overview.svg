<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 540" role="img" aria-labelledby="title desc">
  <title id="title">VaultTrace deployment overview</title>
  <desc id="desc">GitHub and configured CI, proposed Render frontend/backend deployment, Supabase database and private storage. Render setup is not present in the repository.</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker></defs>
  <rect width="1050" height="540" rx="20" fill="#f8fafc"/>
  <text x="44" y="54" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Deployment topology · Render is an operator target</text>
  <rect x="55" y="145" width="210" height="130" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="80" y="185" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#3730a3">GitHub</text><text x="80" y="218" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">Repository</text><text x="80" y="245" font-family="Arial,sans-serif" font-size="14" fill="#475569">Actions: compile + build</text>
  <rect x="365" y="110" width="300" height="200" rx="18" fill="#fff" stroke="#d97706" stroke-width="3" stroke-dasharray="9 7"/><text x="390" y="148" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">Render (not configured here)</text><rect x="395" y="174" width="240" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="415" y="205" font-family="Arial,sans-serif" font-size="16" fill="#075985">Static frontend · Vite build</text><rect x="395" y="240" width="240" height="50" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="415" y="271" font-family="Arial,sans-serif" font-size="16" fill="#1e3a8a">Backend · FastAPI container</text>
  <rect x="760" y="135" width="235" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="785" y="175" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#166534">Supabase PostgreSQL</text><text x="785" y="207" font-family="Arial,sans-serif" font-size="14" fill="#334155">Runtime DB + Alembic</text>
  <rect x="760" y="270" width="235" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="785" y="310" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#92400e">Private Storage</text><text x="785" y="342" font-family="Arial,sans-serif" font-size="14" fill="#334155">Service key stays backend-side</text>
  <rect x="365" y="390" width="300" height="75" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="390" y="422" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9d174d">Mail service</text><text x="390" y="448" font-family="Arial,sans-serif" font-size="14" fill="#334155">SMTP or Gmail API over HTTPS</text>
  <path d="M265 210 H355 M665 198 H750 M665 270 C720 270 715 320 750 320 M515 310 V380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
  <text x="45" y="510" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Configure HTTPS, service secrets, database backups, storage backups, and a production API port in the hosting platform.</text>
