<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">VaultTrace system architecture</title>
  <desc id="desc">Browser, FastAPI, PostgreSQL, private storage, and email delivery components and trust boundaries.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1100" height="560" rx="20" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">VaultTrace · System Architecture</text>
  <text x="48" y="88" font-family="Arial,sans-serif" font-size="15" fill="#475569">Application-layer authorization protects metadata and private document bytes.</text>
  <rect x="48" y="170" width="210" height="150" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="72" y="210" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#075985">Web client</text>
  <text x="72" y="244" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">React · TypeScript</text>
  <text x="72" y="270" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">Vite · Axios</text>
  <text x="72" y="296" font-family="Arial,sans-serif" font-size="13" fill="#475569">Bearer token in memory</text>
  <rect x="340" y="145" width="280" height="200" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="365" y="186" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">FastAPI service</text>
  <text x="365" y="221" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">Routes · schemas · services</text>
  <text x="365" y="249" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">JWT · RBAC · document grants</text>
  <text x="365" y="277" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">Validation · audit · email</text>
  <text x="365" y="316" font-family="Arial,sans-serif" font-size="13" fill="#475569">Authorization enforced server-side</text>
  <rect x="730" y="118" width="320" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="755" y="158" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#166534">PostgreSQL</text>
  <text x="755" y="191" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">Users · grants · metadata</text>
  <text x="755" y="216" font-family="Arial,sans-serif" font-size="14" fill="#475569">Alembic manages schema</text>
  <rect x="730" y="270" width="320" height="115" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="755" y="310" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">Private file storage</text>
  <text x="755" y="343" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">Local filesystem or Supabase</text>
  <text x="755" y="369" font-family="Arial,sans-serif" font-size="14" fill="#475569">Backend-authorized operations</text>
  <rect x="340" y="405" width="280" height="95" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="365" y="445" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#9d174d">Email delivery</text>
  <text x="365" y="476" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">Mailpit/SMTP or Gmail API</text>
  <path d="M258 245 H330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="263" y="230" font-family="Arial,sans-serif" font-size="12" fill="#475569">HTTPS · JSON</text>
  <path d="M620 205 H720" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="636" y="190" font-family="Arial,sans-serif" font-size="12" fill="#475569">SQLAlchemy</text>
  <path d="M620 295 H720" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="636" y="282" font-family="Arial,sans-serif" font-size="12" fill="#475569">Private bytes</text>
  <path d="M480 355 V395" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="492" y="383" font-family="Arial,sans-serif" font-size="12" fill="#475569">OTP / notices</text>
  <text x="48" y="535" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Email and storage providers are selected by backend configuration. Deployment configuration is operator-managed.</text>
</svg>
