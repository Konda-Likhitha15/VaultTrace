<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500" role="img" aria-labelledby="title desc">
  <title id="title">VaultTrace security layers and roadmap</title>
  <desc id="desc">Implemented application controls separated from planned enterprise hardening.</desc>
  <rect width="1050" height="500" rx="20" fill="#f8fafc"/>
  <text x="44" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Security layers · implemented vs. next steps</text>
  <g font-family="Arial,sans-serif">
    <text x="65" y="120" font-size="17" font-weight="700" fill="#166534">Present in source</text>
    <rect x="55" y="140" width="440" height="58" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="78" y="176" font-size="16" fill="#14532d">Argon2 password hashing · short-lived JWT</text>
    <rect x="75" y="210" width="400" height="58" rx="12" fill="#d1fae5" stroke="#059669"/><text x="98" y="246" font-size="16" fill="#064e3b">OTP digest · expiry · attempt/cooldown limits</text>
    <rect x="95" y="280" width="360" height="58" rx="12" fill="#ccfbf1" stroke="#0d9488"/><text x="118" y="316" font-size="16" fill="#134e4a">API RBAC · per-document authorization</text>
    <rect x="115" y="350" width="320" height="58" rx="12" fill="#cffafe" stroke="#0891b2"/><text x="138" y="386" font-size="16" fill="#164e63">Private storage · audit events</text>
    <text x="585" y="120" font-size="17" font-weight="700" fill="#9a3412">Recommended next</text>
    <rect x="575" y="140" width="420" height="58" rx="12" fill="#ffedd5" stroke="#ea580c"/><text x="598" y="176" font-size="16" fill="#7c2d12">Login and IP/global abuse rate limits</text>
    <rect x="595" y="210" width="380" height="58" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="618" y="246" font-size="16" fill="#78350f">MFA · malware scan and quarantine</text>
    <rect x="615" y="280" width="340" height="58" rx="12" fill="#fce7f3" stroke="#db2777"/><text x="638" y="316" font-size="16" fill="#831843">Immutable audit · recovery drills</text>
    <rect x="635" y="350" width="300" height="58" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="658" y="386" font-size="16" fill="#4c1d95">Dependency and image scanning</text>
  </g>
  <text x="44" y="466" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Source controls are not a certification or proof of production configuration.</text>
</svg>
